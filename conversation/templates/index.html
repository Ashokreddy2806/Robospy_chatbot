{% load static %}
<!doctype html>
<html>
    <head>
        <title>ROBOPSY Chat</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.0/dist/js.cookie.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static '/css/hacker_style.css' %}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css" integrity="sha384-b6lVK+yci+bfDmaY1u0zE8YYJt0TZxLEAFyYSLHId4xoVvsrQu3INevFKo+Xir8e" crossorigin="anonymous">
    </head>

    <body>
        <div class="container pt-2">
            <div class="row text-center">
                <h2>// ROBOPSY Chat //</h2>
                <h4>CITIZEN SCIENCE ARTWORK RUNNING<span class="typing"><span>.</span><span>.</span><span>.</span></span></h4>
                <h4>MODEL RUNNING: <span id="model_marker">None</span><span> | CHATS STORED: {{ file_count }}</span></h4>
            </div>
 
            <div class="row">
                <div class="col border-terminal mb-2">
                    <h3 id="menu_output">MENU</h3>
                    <div class="container" id="chat_output"></div>
                </div>
            </div>
            
            <div class="row">

                <form id="input_form">

                    <input type="text" id="user_input" class="form-control form-control-lg shadow-none" name="user_input" autocomplete="off" autofocus>
                    
                    <!--At this point this button is not needed but left here for possible testing-->
                    <button id="send_button" type="submit" hidden>Send</button>
                    
                </form>
                
            </div>
    
    </div>
    <script src="{% static '/js/script.js' %}"></script>
    </body>
    
</html>
